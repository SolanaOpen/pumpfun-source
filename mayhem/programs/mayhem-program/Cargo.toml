[package]
name = "mayhem-program"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
name = "mayhem_program"
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []
cpi = ["no-entrypoint"]
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
pump-cpi = { path = "../../../crates/pump-cpi" }
anchor-lang = { version = "=1.0.0", features = ["event-cpi", "init-if-needed"] }
anchor-spl = { version = "=1.0.0", default-features = false, features = ["associated_token", "token", "token_2022"] }
